<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Content Manager</title>

    <!--
    Decap CMS admin panel.
    Loaded from node_modules via Astro's static file handling.
    Package: decap-cms-app (installed in kit package.json).

    The CSS and JS paths below reference the built files from the
    installed package. Astro copies public/ files as-is — these
    script/link tags point to files served from /node_modules/
    via Vite's dev server in development, and copied to dist/ in
    production via the astro.config.ts static copy config.

    Accessible at /admin/ when deployed.
    NOT accessible in local dev without the local backend running.

    Local CMS testing:
      npm run cms:local        (runs decap-server in a separate terminal)
      Add to config.yml:  local_backend: true
      Visit:              http://localhost:4321/admin/
      Remove local_backend: true before deploying.

    Netlify Identity setup:
      1. Netlify dashboard → Site settings → Identity → Enable
      2. Identity → Registration → Invite only
      3. Identity → Services → Git Gateway → Enable
      4. Invite client via Identity → Invite users
  -->
    <link rel="stylesheet" href="/admin/decap-cms.css" />
  </head>
  <body>
    <script src="/admin/decap-cms.js"></script>
  </body>
</html>
